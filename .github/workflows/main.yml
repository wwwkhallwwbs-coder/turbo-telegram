name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: فحص مخطط قاعدة البيانات
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -I tools/verify_schema.py

  activation:
    name: فحص رمز التفعيل
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: python3 -I tools/verify_activation.py

  build:
    name: تحليل واختبار وبناء APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: توليد ملفات أندرويد (مرة واحدة)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.abdoshams --project-name makhbazak .
            git checkout -- lib test pubspec.yaml analysis_options.yaml .gitignore
            git clean -fdq lib test
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: makhbazak-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
