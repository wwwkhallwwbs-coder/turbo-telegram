name: Unpack
on: workflow_dispatch
permissions:
  contents: write
  actions: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: فك ضغط makhbazak.zip
        run: |
          set -e
          test -f makhbazak.zip || { echo "ارفع makhbazak.zip أولاً"; exit 1; }
          unzip -q makhbazak.zip -d _x
          mkdir -p ci
          mv _x/makhbazak/.github/workflows/android.yml ci/android.yml
          rm -rf _x/makhbazak/.github
          cp -a _x/makhbazak/. .
          rm -rf _x makhbazak.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "لا توجد تغييرات"; exit 0; }
          git commit -q -m "فك ضغط الإصدار المرفوع"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push && exit 0
            sleep 3
          done
          exit 1
      - name: تشغيل البناء بعد الفك
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run Android --ref main
